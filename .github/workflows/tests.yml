name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Allow long paths (hermes-agent's i18n docs tree exceeds MAX_PATH)
        if: runner.os == 'Windows'
        run: git config --system core.longpaths true
      - uses: actions/checkout@v4
        with:
          path: plugin
      # The plugin imports Hermes core (providers, agent) from a checkout, the way an installed plugin does.
      - uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          path: hermes-agent
      # Hermes manages its dependency overrides in uv.lock. pip install -e
      # cannot apply the Pillow override required by browser-harness.
      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.12.13"
      - name: Install Python
        run: uv python install 3.14
      - name: Install Hermes core and tests from the lockfile
        working-directory: hermes-agent
        run: uv sync --locked --python 3.14 --group dev
      - name: Run the plugin suite (real subprocess tree, real cancellation)
        working-directory: plugin
        env:
          HERMES_AGENT_REPO: ${{ github.workspace }}/hermes-agent
        run: uv run --project ../hermes-agent --no-sync python -m pytest -q
